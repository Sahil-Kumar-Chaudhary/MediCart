# Render Blueprint Configuration for MediCart REST API
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: medicart-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_MODE
        value: DEMO
      - key: DEMO_PHONE_NUMBER
        value: 9876543210
      - key: DEMO_OTP_CODE
        sync: false # Set securely in Render dashboard (e.g. 487210)
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard (MongoDB Atlas connection string)
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a cryptographically secure random secret
