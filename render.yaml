services:
  - type: web
    name: medicart-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_MODE
        value: DEMO
      - key: DEMO_PHONE_NUMBER
        value: 9876543210
      - key: DEMO_OTP_CODE
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
